<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>yourname</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css">
    <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="loading">
        <div id="spinner"></div>
    </div>
    <div id="magnify">
        <h1 onclick="closemagnify()"><i class="fas fa-times"></i></h1>
        <div id="img_here"></div>
    </div>
    <header id="header" class="animated slideInDown" style="animation-delay:1.8s;">
        <table>
            <tr>
                <td id="logo">Miguel Viagens</td>
                <td id="navigation">
                    <a href="#work">Trabalho</a>
                    <a href="#bio">Sobre</a>
                    <a href="index.html">Blog</a>
                    <a href="#contact">Contato</a>
                </td>
            </tr>
        </table>
    </header>
    <table id="top_part">
        <tr>
            <td id="about" class="animated slideInLeft" style="animation-delay:2s;">
                <h1>Fotografia Profissional</h1>
                <button class="btn_one">Contrate</button><br>
                <table>
                    <tr>
                        <td class="animated zoomIn" style="animation-delay:2.2s;"><a class="social"><i class="fab fa-facebook"></i></a></td>
                        <td class="animated zoomIn" style="animation-delay:2.4s;"><a class="social"><i class="fab fa-twitter"></i></a></td>
                        <td class="animated zoomIn" style="animation-delay:2.6s;"><a class="social"><i class="fab fa-instagram"></i></a></td>
                        <td class="animated zoomIn" style="animation-delay:2.8s;"><a class="social"><i class="fab fa-dribbble"></i></a></td>
                        <td class="animated zoomIn" style="animation-delay:3.0s;"><a class="social"><i class="fab fa-medium"></i></a></td>
                    </tr>
                </table>
            </td>
            <td id="rightImage" class="animated jackInTheBox" style="animation-delay:2.2s;"></td>
        </tr>
    </table>
    <div id="work">
        <h1>Trabalho</h1>
        <div id="photos">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/bgh.jpg">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/berlim.jpeg">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/canada.jpg">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/fortaleza.jpg">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/jeri.jpg">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/miami.jpeg">
            <img onclick="magnify($(this).attr('src'))" src="/sdjk-main/assets/paris.jpeg">
        </div>
    </div>
    <div id="bio">
        <h1>Sobre</h1>
        <p>
            Fotografias profissionais
    </div>
    <div id="contact">
        <h1>Contato</h1>
            <table>
                <tr>
                    <td>
                        <div id="inner_div">
                            <table id="inner_table">
                                <tr>
                                    <td><i class="fas fa-phone"></i> &nbsp; (666) 6666-6666</td>
                                </tr>
                                <tr>
                                    <td><i class="fas fa-at"></i> &nbsp; contato@miguelviagens</td>
                                </tr>
                                 <tr>
                                    <td><i class="fas fa-fax"></i> &nbsp; (999) 9999-9999</td>
                                </tr>
                                <tr>
                                    <td><i class="fas fa-map-marker-alt"></i>
                                    <div id="address">
                                        Rua Central,<br>
                                        Tiny,<br>
                                        Dih
                                    </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <a class="social"><i class="fab fa-facebook"></i></a>
                                        <a class="social"><i class="fab fa-twitter"></i></a>
                                        <a class="social"><i class="fab fa-instagram"></i></a>
                                        <a class="social"><i class="fab fa-dribbble"></i></a>
                                        <a class="social"><i class="fab fa-medium"></i></a>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                    <td>
                        <form>
                            <input type="text" placeholder="Nome" required>
                            <input type="email" placeholder="Email" required><br>
                            <textarea placeholder="Mensagem" required rows="5"></textarea><br>
                            <button class="btn_one">Enviar</button>
                        </form> 
                    </td>
                </tr>
            </table>
    </div>
    </div>
    <script src="index.js" type="text/javascript"></script>
</body>
</html>
